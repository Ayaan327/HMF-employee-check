name: Deploy demo
# Manual only: Actions → "Deploy demo" → Run workflow.
# Deploys the pitch demo to Ayaan's own Cloudflare account using deploy/demo.json.
# Needs the repository secret CLOUDFLARE_API_TOKEN (Settings → Secrets and variables → Actions).
on: workflow_dispatch
permissions:
  contents: read
concurrency: deploy-demo
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Generate demo config (refuses placeholders and demo seeding)
        run: node scripts/make-deploy-config.mjs demo
      - name: Apply pending database migrations (additive only)
        run: npx wrangler d1 migrations apply hmf-attendance-demo --remote --config dist/server/wrangler.demo.json
      - name: Deploy
        run: npx wrangler deploy --config dist/server/wrangler.demo.json
